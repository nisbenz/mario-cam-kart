name: Windows

on:
  push:
    branches:
      - master
      - ci/*
  pull_request:
    branches:
      - master

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  DS64_SRC: vendor/melonDS-src

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v4
    - name: Set up CMake
      uses: lukka/get-cmake@latest
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: "${{ env.DS64_SRC }}/vcpkg.json"
    # See build-macos.yml for why this runs cmake directly instead of
    # through lukka/run-cmake — CMakePresets.json must sit in the
    # directory cmake is invoked from, which the lukka action doesn't
    # support pointing at a subdirectory of the checked-out repo.
    - name: Configure
      working-directory: ${{ env.DS64_SRC }}
      shell: pwsh
      run: >
        cmake --preset release-windows-${{ matrix.arch.name }}
        -DENABLE_DEBUG_DEPS=OFF -DMELONDS_EMBED_BUILD_INFO=ON
        -DVCPKG_ROOT="$env:VCPKG_ROOT"
    - name: Build
      working-directory: ${{ env.DS64_SRC }}
      run: cmake --build --preset release-windows-${{ matrix.arch.name }}
    - uses: actions/upload-artifact@v4
      with:
        name: melonDS-windows-${{ matrix.arch.name }}
        path: ${{ env.DS64_SRC }}\build\release-windows-${{ matrix.arch.name }}\melonDS.exe
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
