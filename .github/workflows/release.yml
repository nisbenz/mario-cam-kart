name: Release

# Builds melonDS for Windows/macOS/Linux and publishes them as downloadable
# assets on a GitHub Release whenever a version tag (v1.0.0 etc.) is pushed.
# This is what lets someone install DS64 without building from source
# themselves — see the "Install a prebuilt release" section in README.md.
on:
  push:
    tags:
      - "v*"

env:
  DS64_SRC: vendor/melonDS-src
  # Required whenever -DMELONDS_EMBED_BUILD_INFO=ON is passed (every
  # build job below) — src/CMakeLists.txt hard-errors if any of these
  # three are empty.
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Self-contained AppImage (Qt + bundled Python + all DS64 Python deps),
      # built in a clean ubuntu:22.04 container — see the script's header.
      - name: Build the AppImage
        run: |
          mkdir -p dist
          docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) \
            -e MELONDS_GIT_BRANCH -e MELONDS_GIT_HASH -e MELONDS_BUILD_PROVIDER \
            -v "$PWD":/src:ro -v "$PWD/dist":/out -v "$HOME/.cache/ds64-appimage":/cache ubuntu:22.04 \
            bash /src/packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DS64-linux-x86_64
          path: dist/DS64-x86_64.AppImage

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: macos-15
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake autoconf-archive libtool python-setuptools
      - uses: lukka/get-cmake@latest
      # See build-macos.yml for why this is needed: Homebrew's python@3.x
      # on these (Apple Silicon) runners is arm64-only, which breaks
      # linking the embedded-Python symbols for an x86_64 build.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.arch }}-osx-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
          restore-keys: vcpkg-${{ matrix.arch }}-osx-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "${{ env.DS64_SRC }}/vcpkg.json"
      - name: Configure
        working-directory: ${{ env.DS64_SRC }}
        run: >
          cmake --preset release-mac-${{ matrix.arch }}
          -DMELONDS_EMBED_BUILD_INFO=ON -DVCPKG_ROOT="$VCPKG_ROOT"
          -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"
      - name: Build
        working-directory: ${{ env.DS64_SRC }}
        run: cmake --build --preset release-mac-${{ matrix.arch }}
      - name: Compress app bundle
        run: |
          cd ${{ env.DS64_SRC }}/build/release-mac-${{ matrix.arch }}
          zip -r -y "$GITHUB_WORKSPACE/DS64-macos-${{ matrix.arch }}.zip" melonDS.app
      - uses: actions/upload-artifact@v4
        with:
          name: DS64-macos-${{ matrix.arch }}
          path: DS64-macos-${{ matrix.arch }}.zip

  build-windows:
    runs-on: windows-2025
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-x86_64-windows-${{ hashFiles(format('{0}/vcpkg.json', env.DS64_SRC)) }}
          restore-keys: vcpkg-x86_64-windows-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "${{ env.DS64_SRC }}/vcpkg.json"
      - name: Configure
        working-directory: ${{ env.DS64_SRC }}
        shell: pwsh
        run: >
          cmake --preset release-windows-x86_64
          -DENABLE_DEBUG_DEPS=OFF -DMELONDS_EMBED_BUILD_INFO=ON
          -DVCPKG_ROOT="$env:VCPKG_ROOT"
      - name: Build
        working-directory: ${{ env.DS64_SRC }}
        run: cmake --build --preset release-windows-x86_64
      - name: Zip binary
        shell: pwsh
        run: Compress-Archive -Path "${{ env.DS64_SRC }}\build\release-windows-x86_64\melonDS.exe" -DestinationPath "DS64-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DS64-windows-x86_64
          path: DS64-windows-x86_64.zip

  publish:
    needs: [build-ubuntu, build-macos, build-windows]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks
    # for more — without this, softprops/action-gh-release fails with
    # "Resource not accessible by integration" (403) trying to create
    # the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact layout
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
